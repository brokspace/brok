name: Publish crates

# Publishes every crate of the workspace to crates.io, in dependency order,
# from a release tag, using crates.io Trusted Publishing (OIDC): no
# CARGO_REGISTRY_TOKEN secret exists or is needed.
#
# This is a standalone workflow on purpose: a Trusted Publisher matches the
# workflow file in the OIDC identity. Configure one per crate with
# owner=brokspace, repository=brok, workflow=publish-crates.yml,
# environment=crates-io (see docs/publishing.md).
#
# It runs on the release tag, then waits for the Release workflow to publish
# the GitHub release, so a crate is never published for a release whose
# binaries failed to build. Re-run by hand with:
#   gh workflow run publish-crates.yml -f tag=vX.Y.Z

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.4.2)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Wait for the GitHub release to be published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Release workflow publishes the draft only after every platform
          # built. Give up after 90 minutes; the workflow can be re-run.
          for _ in $(seq 1 180); do
            draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
            [ "$draft" = "false" ] && exit 0
            echo "release $TAG is not published yet ($draft); waiting"
            sleep 30
          done
          echo "::error::release $TAG was not published within 90 minutes"; exit 1
      - name: The tag matches the brok-cli workspace version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "brok-cli") | .version')"
          [ "v$version" = "$TAG" ] || { echo "::error::tag $TAG does not match brok-cli version $version"; exit 1; }
      - name: Vendor the built-in skills into brok-skills
        run: bash scripts/vendor-skills.sh
      - name: Find the crates that still need publishing
        id: pending
        shell: bash
        run: |
          missing=()
          for crate in brok-core brok-bus brok-index brok-shard brok-skills brok-cli; do
            version="$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')"
            if curl -fsS -A "brokspace-release (github.com/brokspace/brok)" "https://crates.io/api/v1/crates/$crate/$version" >/dev/null 2>&1; then
              echo "$crate $version is already published"
            else
              missing+=("$crate")
            fi
          done
          echo "crates=${missing[*]}" >> "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io Trusted Publishing
        id: auth
        # Trusted Publishing when the crate has a Trusted Publisher; otherwise
        # the CARGO_REGISTRY_TOKEN secret below is used.
        continue-on-error: true
        if: steps.pending.outputs.crates != ''
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish in dependency order
        if: steps.pending.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
          MISSING_CRATES: ${{ steps.pending.outputs.crates }}
        shell: bash
        run: |
          set -o pipefail
          # Versions already on crates.io were skipped above, so a failed run
          # can simply be re-run; rate limits are waited out.
          # --no-verify: CI already built and tested this commit everywhere.
          # --allow-dirty: the vendored skills are copied in on purpose.
          for crate in $MISSING_CRATES; do
            for attempt in 1 2 3 4; do
              if cargo publish -p "$crate" --no-verify --allow-dirty 2>&1 | tee publish.log; then
                break
              fi
              if grep -q "429" publish.log && [ "$attempt" -lt 4 ]; then
                echo "crates.io rate limited this publish; waiting 10 minutes"
                sleep 600
              else
                exit 1
              fi
            done
          done
