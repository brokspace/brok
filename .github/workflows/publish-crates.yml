name: Publish crates

# Publishes every crate of the workspace to crates.io, in dependency order,
# from a release tag. Run it after the Release workflow:
#   gh workflow run publish-crates.yml -f tag=vX.Y.Z
# Needs the CARGO_REGISTRY_TOKEN secret (organization or repository).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.2.0)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Vendor the built-in skills into brok-skills
        run: bash scripts/vendor-skills.sh
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set (gh secret set CARGO_REGISTRY_TOKEN --org brokspace --visibility all)"
            exit 1
          fi
          # Dependency order. Versions already on crates.io are skipped, so a
          # failed run can simply be re-run; rate limits are waited out.
          # --no-verify: CI already built and tested this commit everywhere.
          # --allow-dirty: the vendored skills are copied in on purpose.
          for crate in brok-core brok-bus brok-index brok-shard brok-skills brok-cli; do
            version="$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')"
            if curl -fsS -A "brokspace-release (github.com/brokspace/brok)" "https://crates.io/api/v1/crates/$crate/$version" >/dev/null 2>&1; then
              echo "$crate $version is already published"
              continue
            fi
            for attempt in 1 2 3 4; do
              if cargo publish -p "$crate" --no-verify --allow-dirty 2>&1 | tee publish.log; then
                break
              fi
              if grep -q "429" publish.log && [ "$attempt" -lt 4 ]; then
                echo "rate limited; waiting 10 minutes"
                sleep 600
              else
                exit 1
              fi
            done
          done
