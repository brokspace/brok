name: Publish crates

# Publishes every crate of the workspace to crates.io, in dependency order,
# from a release tag. Run it after the Release workflow:
#   gh workflow run publish-crates.yml -f tag=vX.Y.Z
# Needs the CARGO_REGISTRY_TOKEN secret (organization or repository).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.2.0)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Vendor the built-in skills into brok-skills
        run: bash scripts/vendor-skills.sh
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set (gh secret set CARGO_REGISTRY_TOKEN --org brokspace --visibility all)"
            exit 1
          fi
          # CI already built and tested this commit on every platform.
          # --allow-dirty: the vendored skills are copied in on purpose (git-ignored).
          cargo publish --workspace --no-verify --allow-dirty
