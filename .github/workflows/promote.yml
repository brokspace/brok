name: Promote

# Promotes staging to main and releases from the Conventional Commits: version PR, tag vX.Y.Z, release.yml.
# See brokspace/.github, "Zero-touch releases".
on:
  push:
    branches: [staging, main]
  # The release window: the version PR merges, and the release follows, when this runs.
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  promote:
    uses: brokspace/.github/.github/workflows/promote.yml@main
    with:
      release: true
    secrets: inherit
