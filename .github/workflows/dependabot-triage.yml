name: Dependabot

# Patch and minor updates merge themselves once CI passes; majors wait for a review.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependabot:
    uses: brokspace/.github/.github/workflows/dependabot.yml@main
    secrets: inherit
