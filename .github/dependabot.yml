version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      arrow-lance:
        patterns: ["arrow*", "lancedb", "lance*"]
      tree-sitter:
        patterns: ["tree-sitter*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
