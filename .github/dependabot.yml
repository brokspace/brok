version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      arrow-lance:
        patterns: ["arrow*", "lancedb", "lance*"]
      tree-sitter:
        patterns: ["tree-sitter*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # `@1.89` selects the MSRV toolchain; it is not an action version.
      - dependency-name: dtolnay/rust-toolchain
